set -g prefix C-a

set -g default-terminal "tmux-256color"

# Enable true color.
set-option -sa terminal-overrides ",xterm-256color:Tc"

set -g history-limit 50000
set -g renumber-windows on
set -g focus-events on
set -g mouse on
set -g set-clipboard on
set -g copy-command "xclip -selection primary -in"
# GNOME Terminal ignores OSC 52, so clipboard writes from programs in panes
# (Claude Code, nvim, anything over ssh) stop in a tmux buffer. Forward them to
# the X CLIPBOARD (Ctrl+V) and PRIMARY (middle click) selections.
set-hook -g pane-set-clipboard 'run-shell -b "for s in clipboard primary; do tmux save-buffer - | xclip -selection \$s -in >/dev/null 2>&1 & done"'
# Codex also copies with `tmux load-buffer -w`, which does not emit
# pane-set-clipboard. Mirror that path to both X selections as well.
set-hook -g after-load-buffer 'set-hook -R pane-set-clipboard'

# Middle click pastes the local PRIMARY selection into any app, including
# mouse-aware TUIs and remote terminals. Preserve tmux's handling in copy mode.
bind -T root MouseDown2Pane select-pane -t = \; if -F '#{pane_in_mode}' { send -M } { run -b '~/.local/bin/paste-primary #{pane_id}' }
set -sg escape-time 10

bind C-a last-window
bind a send-prefix

# Upload the local screenshot clipboard to the foreground SSH connection.
bind u run-shell -b '~/.local/bin/clip-to-remote --pane #{pane_pid} --tmux-target #{pane_id}'

# Open new windows and panes in the current pane's directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Repeatable pane resizing with prefix + capital Vim directions.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Forward navigation through SSH/mosh to remote tmux and Vim.
set -g @vim_navigator_pattern '(\S+/)?g?\.?(view|l?n?vim?x?|fzf|ssh|mosh)(diff)?(-wrapped)?'

# Load colorscheme
source-file ~/.tmux/tmux-colorscheme.conf

# Initialize tmux plugin manager
run '~/.tmux/plugins/tpm/tpm'
