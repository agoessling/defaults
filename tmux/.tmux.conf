set -g prefix C-a

set -g default-terminal "tmux-256color"

# Enable true color.
set-option -sa terminal-overrides ",xterm-256color:Tc"

set -g history-limit 50000
set -g renumber-windows on
set -g focus-events on
set -g mouse on
set -g set-clipboard on
set -g copy-command "xclip -selection primary -in"
set -sg escape-time 10

bind C-a last-window
bind a send-prefix

# Open new windows and panes in the current pane's directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Repeatable pane resizing with prefix + capital Vim directions.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Load colorscheme
source-file ~/.tmux/tmux-colorscheme.conf

# Initialize tmux plugin manager
run '~/.tmux/plugins/tpm/tpm'
